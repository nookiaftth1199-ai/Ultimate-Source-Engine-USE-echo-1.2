; ============================================================
; Ultimate Source Engine - Default Configuration
; ============================================================
; This file contains default settings used when no other
; configuration file is present. It can be overridden by
; engine.cfg or game-specific configs.
; ============================================================

[Graphics]
width = 1024
height = 768
fullscreen = 0
vsync = 1
render_backend = auto
fov = 90.0
shadow_quality = 1
texture_quality = 1

[Audio]
volume = 0.8
music_volume = 0.6
sfx_volume = 0.8
device = default

[Input]
mouse_sensitivity = 1.5
invert_mouse_y = 0
gamepad_deadzone = 0.15

[Console]
enabled = 1
toggle_key = 41
font_size = 14

[Physics]
gravity = 0, -9.81, 0
backend = auto
debug_draw = 0

[Network]
port = 27015
max_clients = 8
timeout = 30

[Scripting]
lua_enabled = 1
script_path = ./Assets/Scripts/

[Profiling]
enabled = 0
output_file = profile.log