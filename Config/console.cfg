; ============================================================
; Ultimate Source Engine - Console Configuration
; ============================================================
; This file is executed automatically when the console system
; initializes. It sets default CVars and console preferences.
; ============================================================

; Console appearance
con_height 50              ; Height percentage (0-100)
con_speed 8.0              ; Animation speed (units per second)
con_fontsize 16            ; Font size in pixels
con_colorscheme source     ; Color scheme: source, dark, light

; Behavior
con_history 100            ; Command history size
con_messages 1000          ; Maximum messages to keep
con_autocomplete 1         ; Enable tab completion (0/1)
con_timestamps 0           ; Show timestamps in messages (0/1)
con_sound 1                ; Enable console sounds (0/1)

; Developer settings
developer 0                ; Developer mode (0/1)
sv_cheats 0                ; Enable cheat commands (0/1)

; Logging
con_logtofile 0            ; Log console output to file (0/1)
con_logfile "console.log"  ; Log file name

; Console toggle key (scancode 41 = tilde/backquote)
bind "`" "toggleconsole"

; Default CVars from other systems
r_width 1280               ; Screen width
r_height 720               ; Screen height
r_fullscreen 0             ; Fullscreen mode
r_vsync 1                  ; Vertical sync
s_volume_master 1.0        ; Master volume
s_volume_sfx 1.0           ; Sound effects volume
s_volume_music 0.8         ; Music volume
cl_sensitivity 2.0         ; Mouse sensitivity
cl_invert_y 0              ; Invert mouse Y axis