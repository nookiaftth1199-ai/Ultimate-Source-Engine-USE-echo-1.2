; ============================================================
; Ultimate Source Engine - Engine Configuration
; ============================================================

[Graphics]
; Screen resolution
width = 1280
height = 720

; Fullscreen mode (0 = windowed, 1 = fullscreen)
fullscreen = 0

; Vertical sync (0 = off, 1 = on)
vsync = 1

; Render backend (opengl, directx9, vulkan, auto)
render_backend = auto

; Field of view (degrees)
fov = 90.0

; Shadow quality (0 = low, 1 = medium, 2 = high)
shadow_quality = 2

; Texture quality (0 = low, 1 = medium, 2 = high)
texture_quality = 2

[Audio]
; Master volume (0.0 to 1.0)
volume = 1.0

; Music volume (0.0 to 1.0)
music_volume = 0.8

; SFX volume (0.0 to 1.0)
sfx_volume = 1.0

; Audio device (default = system default)
device = default

[Input]
; Mouse sensitivity
mouse_sensitivity = 2.0

; Invert mouse Y axis (0 = off, 1 = on)
invert_mouse_y = 0

; Gamepad deadzone (0.0 to 1.0)
gamepad_deadzone = 0.1

[Console]
; Enable developer console (0 = off, 1 = on)
enabled = 1

; Console key (scancode, default = 41 for tilde/backquote)
toggle_key = 41

; Console font size
font_size = 16

[Physics]
; Gravity vector (x, y, z)
gravity = 0, -9.81, 0

; Physics backend (bullet, physx, jolt, auto)
backend = auto

; Enable debug drawing (0 = off, 1 = on)
debug_draw = 0

[Network]
; Default server port
port = 27015

; Maximum clients
max_clients = 16

; Connection timeout (seconds)
timeout = 30

[Scripting]
; Enable Lua scripting (0 = off, 1 = on)
lua_enabled = 1

; Scripts directory
script_path = ./Assets/Scripts/

[Profiling]
; Enable profiler (0 = off, 1 = on)
enabled = 0

; Profiler output file
output_file = profile.log