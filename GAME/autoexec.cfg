// SRC_Engine/Game/autoexec.cfg
// This file executes automatically on engine start

// Console settings
con_height 50
con_speed 8.0
con_history 100
con_messages 500

// Renderer settings
r_width 1280
r_height 720
r_fullscreen 0
r_vsync 1

// Sound settings  
s_volume 1.0
s_enabled 1

// Game settings
cl_sensitivity 2.0
cl_showfps 0

// Welcome message
echo "SRC Engine Console Initialized"
echo "Type 'help' for commands"